version: 2
updates:
  # Only this action's own workflow pins. The projects under test/ are
  # fixtures — one current, well-trusted dependency each, there so the CLI has
  # a component to catalogue — so no ecosystem is configured for them. They
  # used to hold a stale set with a jest tree behind it, which is what made
  # Dependabot security alerts against test/ a standing background noise.
  #
  # (`exclude-paths` used to sit here; it is not a dependabot key and did
  # nothing. Pull requests against the fixtures come from Dependabot *security*
  # updates, which scan the whole repository regardless of this file; turn
  # those off in the repository's settings, not here.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
