name: Manual Tag Creation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag version (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: write  # Ensures only users with write access can push tags

jobs:
  tag:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Ensures all tags are fetched

      - name: Validate Tag Format
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format. Use semantic versioning (e.g., v1.0.0)."
            exit 1
          fi

      - name: Check If Tag Exists
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag already exists!"
            exit 1
          fi

      - name: Create and Push Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Move the Major Tag
        run: |
          major="${TAG%%.*}"
          # Only the newest release in a major moves it, so a patch to an older line never drags it back.
          if [ "$(git tag --list "$major.*" --sort=-v:refname | head -n1)" = "$TAG" ]; then
            git tag -f "$major" "$TAG"
            git push -f origin "refs/tags/$major"
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
