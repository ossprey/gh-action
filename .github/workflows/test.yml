name: CICD - Test Code

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # -x follows the `. lib.sh` sources so the helpers are checked too.
      - name: shellcheck
        run: shellcheck -x scripts/*.sh test/*.sh test/unit/*.sh

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: ./test/unit/run.sh

  # End-to-end, against the CLI this action drives. The CLI is built from its
  # own main branch rather than downloaded from a release, so a change there
  # that breaks the contract between the two repos (the --report JSON keys,
  # above all) fails here instead of in a user's pipeline. The download path
  # itself is scripts/install-cli.sh, which every non-CI run exercises.
  action:
    name: Action (${{ matrix.case }})
    runs-on: ubuntu-latest
    env:
      # Test against the CLI built below rather than a published release.
      OSSPREY_CLI: ${{ github.workspace }}/.ossprey-cli-bin/ossprey
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: python
            path: test/python_simple_math
          - case: npm
            path: test/npm_simple_math
          - case: yarn
            path: test/yarn_simple_math
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ossprey/ossprey-cli
          path: .ossprey-cli

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .ossprey-cli/go.mod
          cache-dependency-path: .ossprey-cli/go.sum

      - name: Build the CLI
        run: |
          mkdir -p "$(dirname "$OSSPREY_CLI")"
          go build -o "$OSSPREY_CLI" ./cmd/ossprey
        working-directory: .ossprey-cli

      - name: Scan a clean project
        id: clean
        uses: ./
        with:
          path: ${{ matrix.path }}
          dry-run-safe: true
          comment: never

      - name: Scan a project with malware
        id: malware
        uses: ./
        with:
          path: ${{ matrix.path }}
          dry-run-malicious: true
          # soft-fail so the job survives the finding and can assert on it.
          soft-fail: true
          comment: never

      - name: Assert the outputs
        env:
          CLEAN_VERDICT: ${{ steps.clean.outputs.verdict }}
          CLEAN_COUNT: ${{ steps.clean.outputs.findings-count }}
          MALWARE_VERDICT: ${{ steps.malware.outputs.verdict }}
          MALWARE_COUNT: ${{ steps.malware.outputs.findings-count }}
          MALWARE_FINDINGS: ${{ steps.malware.outputs.findings }}
          MALWARE_SUMMARY: ${{ steps.malware.outputs.summary }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ "$2" = "$3" ]; then
              echo "  ✓ $1"
            else
              echo "  ✗ $1: got '$2', want '$3'"
              fail=1
            fi
          }
          check "clean verdict" "$CLEAN_VERDICT" clean
          check "clean findings" "$CLEAN_COUNT" 0
          check "malware verdict" "$MALWARE_VERDICT" malware
          check "malware findings" "$MALWARE_COUNT" 1
          # The findings output must be parseable JSON naming a package —
          # that is the whole contract downstream steps build on.
          name="$(printf '%s' "$MALWARE_FINDINGS" | jq -er '.[0].name')"
          [ -n "$name" ] && echo "  ✓ findings names $name"
          case "$MALWARE_SUMMARY" in
            *"malware detected"*) echo "  ✓ summary renders the verdict" ;;
            *) echo "  ✗ summary did not render the verdict"; fail=1 ;;
          esac
          exit "$fail"

  # The v1 (Docker/Python) input names must keep working: upgrading should be a
  # one-line change to `uses:`, not a rewrite of everyone's workflow.
  legacy-inputs:
    name: Legacy inputs
    runs-on: ubuntu-latest
    env:
      OSSPREY_CLI: ${{ github.workspace }}/.ossprey-cli-bin/ossprey
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ossprey/ossprey-cli
          path: .ossprey-cli

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .ossprey-cli/go.mod
          cache-dependency-path: .ossprey-cli/go.sum

      - name: Build the CLI
        run: |
          mkdir -p "$(dirname "$OSSPREY_CLI")"
          go build -o "$OSSPREY_CLI" ./cmd/ossprey
        working-directory: .ossprey-cli

      - name: Scan with the v1 input names
        id: v1
        uses: ./
        with:
          package: "test/python_simple_math"
          mode: "python-requirements"
          github_comments: false
          verbose: true
          dry_run_safe: true

      - name: Assert the verdict
        env:
          VERDICT: ${{ steps.v1.outputs.verdict }}
        run: |
          [ "$VERDICT" = clean ] || { echo "got '$VERDICT', want clean"; exit 1; }
